<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pattern.name}">单例模式</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
</head>
<body>
    <header>
        <a href="/" class="back-btn">&larr; 返回</a>
        <h1>
            <span th:text="${pattern.name}">单例模式</span>
            <small th:text="${pattern.nameEn}">Singleton Pattern</small>
        </h1>
    </header>

    <main class="detail">
        <nav class="tabs">
            <button class="tab active" data-tab="description">模式说明</button>
            <button class="tab" data-tab="diagram">类图</button>
            <button class="tab" data-tab="code">示例代码</button>
            <button class="tab" data-tab="examples">应用案例</button>
        </nav>

        <section id="description" class="tab-content active">
            <h2>模式说明</h2>
            <div class="field">
                <h3>定义</h3>
                <p th:text="${pattern.definition}"></p>
            </div>
            <div class="field">
                <h3>意图</h3>
                <p th:text="${pattern.intent}"></p>
            </div>
            <div class="field">
                <h3>适用场景</h3>
                <p th:text="${pattern.useCases}"></p>
            </div>
            <div class="field">
                <h3>优缺点</h3>
                <p th:text="${pattern.prosCons}"></p>
            </div>
            <div class="field">
                <h3>相关模式</h3>
                <p th:text="${pattern.relatedPatterns}"></p>
            </div>
        </section>

        <section id="diagram" class="tab-content">
            <h2>Mermaid类图</h2>
            <div class="mermaid" th:utext="${pattern.mermaidDiagram}"></div>
        </section>

        <section id="code" class="tab-content">
            <h2>示例代码</h2>
            <div class="code-files">
                <div class="code-file" th:each="codeFile : ${pattern.codeExample}">
                    <h3 class="file-name" th:text="${codeFile.fileName}">FileName.java</h3>
                    <pre class="code-block"><code class="language-java" th:text="${codeFile.content}"></code></pre>
                </div>
            </div>
            <button class="btn run-btn" onclick="runExample()">运行示例</button>
            <div id="output" class="output hidden"></div>
        </section>

        <section id="examples" class="tab-content">
            <h2>实际应用案例</h2>
            <div class="field">
                <h3>Spring框架</h3>
                <p th:text="${pattern.springExample}"></p>
            </div>
            <div class="field">
                <h3>JDK</h3>
                <p th:text="${pattern.jdkExample}"></p>
            </div>
            <div class="field">
                <h3>实际项目</h3>
                <p th:text="${pattern.realWorldExample}"></p>
            </div>
        </section>
    </main>

    <script th:src="@{/js/app.js}"></script>
    <script>
        // 页面加载时保存原始的 mermaid 代码
        let originalMermaidCode = '';
        let diagramInitialized = false;

        // 渲染 Mermaid 图表
        async function renderMermaidDiagram() {
            const mermaidDiv = document.querySelector('.mermaid');
            if (!mermaidDiv || diagramInitialized) return;

            // 使用保存的原始代码
            const diagramCode = originalMermaidCode;
            if (!diagramCode) {
                console.error('No original mermaid code found');
                return;
            }

            try {
                // 初始化 mermaid 配置
                mermaid.initialize({
                    startOnLoad: false,
                    theme: 'default',
                    securityLevel: 'loose'
                });

                // 渲染图表
                const { svg } = await mermaid.render('mermaid-svg-' + Date.now(), diagramCode);
                mermaidDiv.innerHTML = svg;
                diagramInitialized = true;
                console.log('Mermaid diagram rendered successfully');
            } catch (error) {
                console.error('Mermaid render error:', error);
                mermaidDiv.innerHTML = '<p style="color: red; padding: 10px; border: 1px solid red; background: #fee;">图表渲染失败: ' + error.message + '</p>';
            }
        }

        // 在页面加载完成后立即保存原始代码并预渲染图表
        document.addEventListener('DOMContentLoaded', async function() {
            // 初始化 highlight.js
            hljs.highlightAll();

            const mermaidDiv = document.querySelector('.mermaid');
            if (mermaidDiv) {
                originalMermaidCode = mermaidDiv.textContent.trim();
                console.log('Original mermaid code saved:', originalMermaidCode.substring(0, 100));
                // 预先渲染图表，避免首次切换时的抖动
                await renderMermaidDiagram();
            }
        });

        // 标签切换
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                const tabContent = document.getElementById(tab.dataset.tab);
                tabContent.classList.add('active');
            });
        });

        function runExample() {
            const patternId = '[[${pattern.id}]]';
            fetch('/execute/' + patternId)
                .then(r => r.json())
                .then(data => {
                    const output = document.getElementById('output');
                    output.textContent = data.output;
                    output.classList.remove('hidden');
                });
        }
    </script>
</body>
</html>
